<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Applets</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    background: #0f172a;
    color: #f1f5f9;
  }
  h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 0.02em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.25rem;
    width: min(720px, 90vw);
  }
  a.game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 2rem 1.5rem;
    border-radius: 14px;
    background: #1e293b;
    color: #f1f5f9;
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 600;
    border: 1px solid #334155;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.game:hover {
    background: #334155;
    transform: translateY(-2px);
  }
  a.game .emoji {
    font-size: 2.2rem;
  }
</style>
</head>
<body>

<h1>Choose a game</h1>

<div class="grid">
  <a class="game" href="football_dribble_game/index.html">
    <span class="emoji">⚽️</span>
    Football Dribble
  </a>
  <a class="game" href="football_trajectory_applet/index.html">
    <span class="emoji">🎯</span>
    Football Trajectory
  </a>
  <a class="game" href="basketball_shot_applet/index.html">
    <span class="emoji">🏀</span>
    Basketball Shot
  </a>
  <a class="game" href="zlatan_parkour/index.html">
    <span class="emoji">🤸</span>
    Zlatan's Ponytail Parkour
  </a>
</div>

</body>
</html>
